<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Samuel Vogel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

<main class="contact-page">

    <header class="hero contact-hero">
        <h1 class="name">Get in Touch</h1>
        <p class="subtitle">
            Fill out the form below and I’ll get back to you shortly.
        </p>
    </header>

    <section class="card contact-card">
        <form class="contact-form">
            <label>
                <span class="contact-label">Full Name</span>
                <input type="text" name="name" required>
            </label>

            <label>
                <span class="contact-label">Email Address</span>
                <input type="email" name="email" required>
            </label>

            <label>
                <span class="contact-label">Message</span>
                <textarea name="message" rows="6" required></textarea>
            </label>

            <button type="submit" class="btn btn-primary contact-submit">
                Send Message
            </button>

            <a href="index.html" class="btn btn-ghost contact-back">
                Back to Home
            </a>
        </form>
    </section>

</main>

<footer>
    © <span id="year"></span> Samuel Vogel. All rights reserved.
</footer>

<script src="scripts/main.js"></script>
</body>
</html>
